name: shop-import
# Imports the Hortus shop's products from e-mode.pro into shop/source/ and commits the change.
# Run it from the Actions tab (Run workflow) whenever prices, stock or photos should be refreshed.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'One slug from shop/emode-products.json (empty: all)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: shop-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ImageMagick, to resize the photos
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends imagemagick
      - name: Import from e-mode.pro
        env:
          ONLY: ${{ inputs.only }}
        run: node tools/shop/import-emode.mjs ${ONLY:+--only "$ONLY"}
      - name: Commit what changed
        # Also after a partial failure: the products that did import are kept, the rest keep their last good import.
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add shop/source
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Shop: import products from e-mode.pro"
          git push
